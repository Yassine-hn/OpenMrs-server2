worker_processes auto;
error_log /var/log/nginx/error.log;
pid /var/run/nginx.pid;

events {
  worker_connections 4096;
  use epoll;
  multi_accept on;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  keepalive_timeout 180;
  keepalive_requests 1000;
  proxy_read_timeout 300s;
  proxy_connect_timeout 300s;
  tcp_nopush on;
  tcp_nodelay on;
  client_max_body_size 500M;

  upstream monai_backend {
    server monai-server:8002;
    keepalive 64;
  }

  server {
    listen 1026 default_server;
    listen [::]:1026 default_server;
    server_name _;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_proxied any;
    gzip_types
      application/json
      application/octet-stream
      multipart/form-data
      text/css
      application/javascript
      image/svg+xml;
    etag on;
    client_max_body_size 500M;

    # Reverse Proxy to Server 1 Orthanc PACS
    location /pacs/ {
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      client_max_body_size 500M;

      expires 0;
      add_header Cache-Control private;
      add_header 'Access-Control-Allow-Origin' '*' always;
      add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE' always;
      add_header 'Access-Control-Allow-Headers' '*' always;

      if ($request_method = 'OPTIONS') {
        return 204;
      }

      proxy_pass http://10.0.211.249:8042/;
    }

    # Reverse Proxy to local MONAI Label server
    location /monai/ {
      proxy_pass http://monai_backend;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      proxy_request_buffering off;
      proxy_buffering off;  

      proxy_buffer_size 16k;
      proxy_buffers 8 64k;
      proxy_busy_buffers_size 128k;

      gzip off;
      proxy_connect_timeout 300s;
      proxy_read_timeout 300s;
      client_max_body_size 500M;

      add_header 'Access-Control-Allow-Origin' '*' always;
      add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE' always;
      add_header 'Access-Control-Allow-Headers' '*' always;

      if ($request_method = 'OPTIONS') {
        return 204;
      }
    }

    location /sw.js {
      add_header Cache-Control "no-cache";
      proxy_cache_bypass $http_pragma;
      proxy_cache_revalidate on;
      expires off;
      access_log off;
    }

    # OHIF Viewer Single Page App
    location / {
      root /var/www/html;
      index index.html;
      try_files $uri $uri/ /index.html;
      add_header Cache-Control "no-store, no-cache, must-revalidate";
      add_header 'Access-Control-Allow-Origin' '*' always;
      client_max_body_size 800M;
    }

    error_page 405 =200 $uri;
  }
}
